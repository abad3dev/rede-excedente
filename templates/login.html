{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font/bootstrap-icons.css' %}">
        
    <title>Login - Entrar com Google</title>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 1rem;
            border: none;
        }
        .btn-google {
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-google:hover {
            background-color: #f1f3f4;
        }
    </style>

</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container d-flex justify-content-center">
        <div class="card login-card shadow p-5 text-center">
            
            <!-- Ícone ou Logo da sua aplicação -->
            <div class="mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 4rem;"></i>
            </div>
            
            <h3 class="mb-3 fw-bold">Bem-vindo(a)</h3>
            <p class="text-muted mb-5">
                Para acessar o sistema, faça login de forma rápida e segura utilizando sua conta Google.
            </p>

            <!-- Botão de Login com Google -->
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-dark btn-google btn-lg w-100 d-flex align-items-center justify-content-center text-decoration-none">
            <i class="bi bi-google text-danger fs-5 me-3"></i> 
            Continuar com o Google
            </a>

            <div class="mt-4">
                <small class="text-muted">
                    Ao continuar, você concorda com nossos <a href="#" class="text-decoration-none">Termos de Serviço</a> e <a href="#" class="text-decoration-none">Política de Privacidade</a>.
                </small>
            </div>
            
        </div>
    </div>

    
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>














</body>

</html>
